name: Sound Wave CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify Vite production artifact
        run: npm run validate:prod
      - name: Reject duplicate root runtime
        run: |
          test ! -e app.js
          test ! -e styles.css

name: Sound Wave CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify build-independent Sites entrypoint
        run: |
          node --check app.js
          grep -q 'src="./app.js"' index.html
          ! grep -q '/src/main.ts' index.html
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

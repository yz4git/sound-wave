name: Pages Freshness Verify

on:
  push:
    branches: [chatgpt/pages-fresh-cache]
    paths:
      - src/pwa/**
      - public/service-worker.js
      - public/version.json
      - src/main.ts
      - scripts/validate-production.mjs
      - .github/workflows/pages.yml
      - .github/workflows/pages-freshness-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check public/service-worker.js
      - run: npm run build
      - run: npm run validate:prod

name: Voice Lab Verify

on:
  push:
    branches: [chatgpt/voice-lab]
    paths:
      - src/voice/**
      - src/compose/AutoComposeEntry.ts
      - tests/voice-script.test.ts
      - .github/workflows/voice-lab-verify.yml

permissions:
  contents: read

jobs:
  verify-voice-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/voice-script.test.ts
      - run: npm run build
      - run: npm run validate:prod

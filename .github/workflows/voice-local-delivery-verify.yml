name: Voice Local Delivery Verify

on:
  push:
    branches: [chatgpt/voice-lab-local-delivery]
    paths:
      - src/voice/**
      - tests/voice-markup.test.ts
      - tests/voice-expression.test.ts
      - tests/voice-synth-plan.test.ts
      - scripts/validate-production.mjs
      - .github/workflows/voice-local-delivery-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/voice-script.test.ts tests/voice-expression.test.ts tests/voice-markup.test.ts tests/voice-synth-plan.test.ts
      - run: npm run build
      - run: npm run validate:prod

name: One-time lockfile and branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-public-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run lockfile and branch cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Validate production artifact
        run: npm run validate:prod

      - name: Switch CI and Pages to npm ci
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('.github/workflows/ci.yml', '.github/workflows/pages.yml'):
              path = Path(name)
              text = path.read_text()
              text = text.replace('npm install --no-audit --no-fund', 'npm ci --no-audit --no-fund')
              path.write_text(text)
          PY

      - name: Commit lockfile and deterministic installs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci.yml .github/workflows/pages.yml
          git commit -m "Add npm lockfile and use npm ci"
          git push origin HEAD:main

      - name: Delete obsolete chatgpt branches
        shell: bash
        run: |
          branches=(
            "chatgpt/auto-compose-v2-genre-fidelity"
            "chatgpt/auto-compose-v2-genre-style-engine"
            "chatgpt/auto-compose-v4-production-suite"
            "chatgpt/fix-auto-composer-genre-test"
            "chatgpt/full-song-vocal-ensemble-japanese-lyrics"
            "chatgpt/karaoke-lyrics-panel"
            "chatgpt/public-readiness"
            "chatgpt/v20-1-presence-reset"
            "chatgpt/v20-2-anti-crack"
            "chatgpt/v20-3-register-continuity"
            "chatgpt/v20-4-japanese-phoneme-coarticulation"
            "chatgpt/v20-5-karaoke-score-phrasing"
            "chatgpt/v20-6-dynamic-resonance-glottal"
            "chatgpt/v20-7-vocaloid-expression"
            "chatgpt/v20-8-spectral-envelope-trajectory"
            "chatgpt/v20-9-dynamic-source-filter-coupling"
            "chatgpt/v20-human-phrase-model"
            "chatgpt/v21-0-genre-aware-producer-tuning"
            "chatgpt/v21-0-producer-tuning-grammar"
            "chatgpt/v21-1-voice-character-macros"
            "chatgpt/8bit-game-audio"
          )
          failures=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              if git push origin --delete "$branch"; then
                echo "Deleted $branch"
              else
                echo "::error::Failed to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "Already absent: $branch"
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures branch deletion(s) failed"
            exit 1
          fi

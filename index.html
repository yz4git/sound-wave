<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#080a12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SOUND WAVE" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SOUND WAVE</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Sound Wave generative rhythm field"></canvas>
      <section id="hud" aria-live="polite">
        <div class="brand">SOUND <strong>WAVE</strong></div>
        <div class="metric"><span>SCORE</span><b id="score">0</b></div>
        <div class="metric"><span>COMBO</span><b id="combo">0</b></div>
        <div class="metric"><span>FLOW</span><b id="flow">50%</b></div>
        <div class="metric"><span>BPM</span><b id="bpm">112</b></div>
      </section>
      <section id="status">
        <div id="phrase">PHRASE 1 · BAR 1/8</div>
        <div id="objective">OBJECTIVE · READ THE CURRENT</div>
        <div id="chord">C · tonic</div>
        <div id="intent-feedback" class="intent-feedback" aria-hidden="true">
          <b id="intent-feedback-action">INTENT</b>
          <span id="intent-feedback-shift">TENSION</span>
        </div>
        <div id="judgement">PREDICT → SHAPE → RESOLVE</div>
      </section>
      <section id="controls" aria-label="Harmonic controls">
        <button data-intent="resolve" aria-label="Resolve: release tension and land on the tonic">
          <span class="intent-glyph" aria-hidden="true"><i>↓</i><em>◎</em></span>
          <span class="intent-copy"><b>RESOLVE</b><span>LAND / RELEASE</span></span>
          <span class="intent-effect">TENSION ↓</span>
        </button>
        <button data-intent="delay" aria-label="Delay: hold tension and suspend the resolution">
          <span class="intent-glyph" aria-hidden="true"><i>Ⅱ</i><em>〜</em></span>
          <span class="intent-copy"><b>DELAY</b><span>HOLD / SUSTAIN</span></span>
          <span class="intent-effect">TENSION →</span>
        </button>
        <button data-intent="diverge" aria-label="Diverge: split away from the expected harmonic path">
          <span class="intent-glyph" aria-hidden="true"><i>Y</i><em>↗</em></span>
          <span class="intent-copy"><b>DIVERGE</b><span>SPLIT / SURPRISE</span></span>
          <span class="intent-effect">PATH ↗</span>
        </button>
        <button data-intent="intensify" aria-label="Intensify: raise tension and push toward the dominant">
          <span class="intent-glyph" aria-hidden="true"><i>↑</i><em>✦</em></span>
          <span class="intent-copy"><b>INTENSIFY</b><span>BUILD / DRIVE</span></span>
          <span class="intent-effect">TENSION ↑</span>
        </button>
      </section>
      <section id="mutation" class="mutation-screen hidden" aria-hidden="true" aria-label="Choose a run mutation">
        <div class="mutation-card">
          <span class="mutation-kicker">CHOOSE MUTATION</span>
          <strong>RESHAPE THE RUN</strong>
          <div id="mutation-options"></div>
        </div>
      </section>
      <button id="start" class="start-screen">
        <span class="start-kicker">GENERATIVE MUSIC GAME · VITE PRODUCTION</span>
        <strong>TAP TO ENTER<br />THE WAVE</strong>
        <small>No fixed chart. Shape the music on the pulse.</small>
      </button>
      <div id="rotate" role="status">ROTATE TO LANDSCAPE</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
